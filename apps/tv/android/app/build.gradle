apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    // Monorepo: `root` sigue siendo apps/tv, que es donde vive el package.json
    // de esta app, pero los paquetes están izados a los node_modules de la raíz
    // del repo, cuatro niveles por encima de esta carpeta.
    root = file("../../")
    reactNativeDir = file("../../../../node_modules/react-native")
    codegenDir = file("../../../../node_modules/@react-native/codegen")
    cliFile = file("../../../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    // En esta versión hermesc no está dentro de react-native, sino en su propio
    // paquete `hermes-compiler`, mientras el plugin lo sigue buscando en
    // `react-native/sdks/hermesc`. El marcador %OS-BIN% lo sustituye el plugin
    // por win64-bin, osx-bin o linux64-bin según la máquina.
    // Anclado a $rootDir (apps/tv/android) porque el comando no se ejecuta
    // desde esta carpeta: una ruta relativa suelta se resuelve donde no toca.
    hermesCommand = "$rootDir/../../../node_modules/hermes-compiler/hermesc/%OS-BIN%/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/** Donde vive la clave de firma, fuera del repositorio. */
def claveDeLaCasa = new File(System.getProperty('user.home'), '.chocitatv/keystore.properties')

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.m3utv"
    defaultConfig {
        applicationId "com.m3utv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        /*
          Solo ARM: los aparatos de la casa son los cuatro ARM y x86 solo lo
          usan los emuladores.

          Medido: de las librerias nativas del APK, 29,5 MB eran x86 y x86_64
          —React Native, Hermes, SQLite, y ahora tambien el decodificador
          FFmpeg, todos vienen con las cuatro—. Quitarlas baja el APK casi a la
          mitad, y eso se nota en cada instalacion: la tablet Samsung tiene un
          wifi tan flojo que un envio de 67 MB se colgaba indefinidamente.

          Si algun dia hace falta un emulador, se quitan estas dos lineas.
        */
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        /*
          La clave de verdad vive **fuera del repositorio**, que es publico:
          en `~/.chocitatv/keystore.properties`. Aqui solo se lee.

          Android solo acepta una actualizacion firmada con la misma clave,
          asi que esto es lo que permite que un aparato se actualice solo. Y
          por eso la de la plantilla no valia: su clave privada la tiene todo
          el mundo, es la misma en todos los proyectos de React Native.

          **Si se pierde ese fichero no hay mas actualizaciones**: habria que
          desinstalar la aplicacion en todos los aparatos y empezar de cero.
        */
        release {
            if (claveDeLaCasa.exists()) {
                def suyo = new Properties()
                claveDeLaCasa.withInputStream { suyo.load(it) }
                storeFile file(suyo['storeFile'])
                storePassword suyo['storePassword']
                keyAlias suyo['keyAlias']
                keyPassword suyo['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Sin la clave de la casa se firma con la de depuracion, para que
            // un clon recien hecho siga compilando. Lo que sale de ahi no vale
            // para actualizar los aparatos: la firma no coincide.
            signingConfig claveDeLaCasa.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    /*
      El decodificador FFmpeg de media3, si esta compilado.

      Es lo que trae los codecs de audio con licencia —DTS, Dolby TrueHD y los
      Dolby de gama alta—, que se pagan por aparato y casi ningun Android
      incluye: la tele de casa no decodifica DTS y la tablet Samsung no
      decodifica ni AC3. Se compila aparte, en un contenedor, con
      `tools/ffmpeg`, porque necesita el NDK y un `bash` de verdad.

      Va con `fileTree` y no como dependencia fija **para que el proyecto siga
      compilando sin el**: quien clone esto no tiene por que pasar por el
      contenedor para tener una aplicacion que funcione, solo para que suene el
      DTS. Sin el AAR, `fileTree` no encuentra nada y no pasa nada.

      La version del AAR tiene que ser la misma que `RNVideo_media3Version`
      (hoy 1.8.0): la extension se enchufa por reflexion y una version
      distinta no encaja.
    */
    implementation fileTree(dir: 'libs', include: ['*.aar'])
}

/**
 * El bundle también depende de `packages/`, no solo de `apps/tv`.
 *
 * El plugin de React Native vigila lo que hay bajo `root`, que aquí es
 * `apps/tv` porque es donde está el package.json de la app. En un monorepo eso
 * deja fuera `packages/core` y `packages/ui`, que son la mitad del código que
 * acaba dentro del bundle: al cambiarlos, la tarea se quedaba UP-TO-DATE y el
 * APK salía con el JavaScript de la vez anterior. Se pierde una tarde
 * buscando el fallo en el sitio equivocado, porque los tests pasan.
 */
tasks.withType(com.facebook.react.tasks.BundleHermesCTask).configureEach {
    inputs.files(
        fileTree("${rootDir}/../../../packages") {
            include "**/src/**"
            exclude "**/node_modules/**"
        }
    ).withPropertyName("fuentesDelMonorepo").withPathSensitivity(PathSensitivity.RELATIVE)
}

/**
 * El sello de compilación, antes de empaquetar el JavaScript.
 *
 * Lo enseña la pantalla de perfiles para saber, desde el sofá, si un aparato
 * tiene lo último. Se genera aquí y no a mano porque un sello que hay que
 * acordarse de actualizar acaba mintiendo justo sobre lo que se quiere
 * comprobar.
 *
 * `outputs.upToDateWhen { false }` es a propósito: la gracia es que la fecha
 * sea la de esta compilación, no la de la primera.
 */
tasks.register("selloDeCompilacion", Exec) {
    workingDir = file("${rootDir}/../../..")
    commandLine = System.getProperty("os.name").toLowerCase().contains("windows")
            ? ["cmd", "/c", "node", "tools/sello.mjs"]
            : ["node", "tools/sello.mjs"]
    outputs.upToDateWhen { false }
}

tasks.withType(com.facebook.react.tasks.BundleHermesCTask).configureEach {
    dependsOn("selloDeCompilacion")
}
