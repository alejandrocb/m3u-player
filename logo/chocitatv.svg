<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512" role="img" aria-label="ChocitaTV">
  <title>ChocitaTV</title>
  <!--
    El maestro del logotipo. Todo lo demás —los PNG de logo/png y los iconos
    de Android— sale de esta misma geometría.

    Una choza con la luz encendida y la puerta haciendo de ▶. El fondo va
    aparte (el rectángulo redondeado de abajo) para poder usar la marca sola
    sobre cualquier color.
  -->
  <rect width="100" height="100" rx="22.5" fill="#0b0b0c"/>

  <g transform="translate(14 14) scale(0.72)">
    <!-- Tejado a dos aguas, empinado y con alero. -->
    <polygon points="50,3 97,48 3,48" fill="#26ae69"/>
    <!-- Cuerpo, redondeado solo abajo: arriba lo tapa el tejado. -->
    <path d="M17 44 H83 V89 a6 6 0 0 1 -6 6 H23 a6 6 0 0 1 -6 -6 Z" fill="#35d07f"/>
    <!-- La puerta: un arco encendido, que es la luz de dentro. -->
    <path d="M35 71 a15 15 0 0 1 30 0 V95 H35 Z" fill="#f0c14a"/>
    <!-- Y dentro de la luz, la sombra del ▶. -->
    <polygon points="43,67 43,87 61,77" fill="#0b0b0c"/>
  </g>
</svg>
